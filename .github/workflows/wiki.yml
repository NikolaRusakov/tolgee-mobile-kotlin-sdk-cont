name: Publish Wiki
on:
  push:
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # HTML reference + Markdown mirror (/markdown/**.md) + llms.txt / llms-full.txt for LLM agents.
      # The Markdown base URL is the GitHub Pages project URL, so llms.txt links are absolute.
      - name: Generate Wiki
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          ./gradlew dokkaSite "-Pdokka.llms.markdownBaseUrl=https://${OWNER}.github.io/${REPO}/markdown/"

      - name: Upload Wiki
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/dokka/site

  deploy:
    needs: build
    # Forks publish every commit as a preview; the canonical repo publishes master and releases only.
    if: >-
      github.repository != 'tolgee/tolgee-mobile-kotlin-sdk'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
